# lefthook.yml
# Documentation: https://github.com/evilmartians/lefthook

output:
  - summary # Show summary at the end
  - failure # Show only failing jobs
  # - execution  # Commented out to reduce noise

pre-commit:
  parallel: true
  jobs:
    # Extract i18n messages if source files changed
    - name: lingui extract
      run: |
        # Run extraction
        pnpm lingui:extract

        # Check if any locale files were created or modified
        if ! git diff --quiet -- locale/; then
          echo "❌ Translation files need to be updated"
          echo "👉 Run: pnpm lingui:extract && git add locale/"
          git diff --name-only -- locale/
          exit 1
        fi
      glob: '**/*.{js,ts,jsx,tsx}'
      files: git diff --name-only HEAD
      fail_text: 'i18n messages changed. Run pnpm lingui:extract and commit the updates.'

    # Lint staged files
    - name: lint
      run: pnpm lint --fix {staged_files}
      stage_fixed: true
      glob: '*.{js,ts,jsx,tsx}'

    # Format staged files
    - name: format
      run: pnpm format --write {staged_files}
      stage_fixed: true
      glob: '*.{js,ts,jsx,tsx,json,md,css}'

    # Type check only if TypeScript files changed
    - name: check types
      run: pnpm exec tsc --noEmit
      glob: '*.{ts,tsx}'
      files: git diff --name-only HEAD @{push}

pre-push:
  parallel: true
  jobs:
    - name: tests
      run: pnpm test
      # Skip in CI if you have separate test step
      skip:
        - ci

    - name: build check
      run: pnpm build
      skip:
        - ci

    - name: lint
      run: pnpm lint
      skip:
        - ci

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
