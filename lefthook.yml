# lefthook.yml
# Documentation: https://github.com/evilmartians/lefthook

output:
  - summary # Show summary at the end
  - failure # Show only failing jobs
  - execution # Commented out to reduce noise

pre-commit:
  parallel: true
  jobs:
    # Lint staged files
    - name: lint
      run: pnpm lint --fix {staged_files}
      stage_fixed: true
      glob: '*.{js,ts,jsx,tsx}'

    # Format staged files
    - name: format
      run: pnpm format --write {staged_files}
      stage_fixed: true
      glob: '*.{js,ts,jsx,tsx,json,md,css}'

    # Type check only if TypeScript files changed
    - name: check types
      run: pnpm exec tsc --noEmit
      glob: '*.{ts,tsx}'
      files: git diff --name-only HEAD

pre-push:
  parallel: true
  jobs:
    - name: tests
      run: pnpm test
      # Skip in CI if you have separate test step
      skip:
        - ci

    - name: build check
      run: pnpm build
      skip:
        - ci

    - name: lint
      run: pnpm lint
      skip:
        - ci

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
